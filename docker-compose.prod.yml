services:
  backend:
    build:
      context: ./back
      dockerfile: Dockerfile.prod
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_NAME=${DB_NAME:-metropoli}
    volumes:
      - uploads_data:/app/public
    depends_on:
      - db
    networks:
      - app-network
    restart: always

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile.prod
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - app-network
    restart: always

  db:
    image: mysql:8.0
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-metropoli}
    volumes:
      - db_data:/var/lib/mysql
      - ./back/src/data-access/create.sql:/docker-entrypoint-initdb.d/a_create.sql
      - ./back/src/data-access/init.sql:/docker-entrypoint-initdb.d/b_init.sql
    networks:
      - app-network

  mongo:
    image: mongo:8.0
    restart: always
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
  mongo_data:
  uploads_data:
