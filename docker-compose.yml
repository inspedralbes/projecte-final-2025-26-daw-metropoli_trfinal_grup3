services:
  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - MONGO_URI=${MONGO_URI}
    develop:
      watch:
        - action: sync
          path: ./back
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./back/package.json
    volumes:
      - ./back:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      db:
        condition: service_healthy # ← espera a que MySQL esté 100% listo
    networks:
      - app-network

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
      - VITE_GIPHY_API_KEY=${VITE_GIPHY_API_KEY}
      - NODE_OPTIONS=--max-old-space-size=4096
    develop:
      watch:
        - action: sync
          path: ./front
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./front/package.json
    volumes:
      - ./front:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - app-network

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./back/src/data-access/create.sql:/docker-entrypoint-initdb.d/a_create.sql
      - ./back/src/data-access/init.sql:/docker-entrypoint-initdb.d/b_init.sql
      - ./back/src/data-access/test_navigation_data.sql:/docker-entrypoint-initdb.d/z_test_navigation_data.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USER}", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
  # ⚠️ Contenedor mongo local ELIMINADO — ahora usamos MongoDB Atlas (ver .env)

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
