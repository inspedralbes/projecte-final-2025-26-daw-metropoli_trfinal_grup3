<!doctype html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo/logo.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>WeMap - Explora la teva ciutat</title>

    <!-- ── SEO Bàsic ── -->
    <meta name="description" content="WeMap: descobreix rutes, llocs únics i connecta amb altres exploradors urbans. L'app d'exploració de ciutat definitiva." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://catcircuit.cat" />

    <!-- ── OpenGraph (Facebook, WhatsApp, Instagram, LinkedIn) ── -->
    <meta property="og:type"         content="website" />
    <meta property="og:url"          content="https://catcircuit.cat" />
    <meta property="og:title"        content="WeMap - Explora la teva ciutat" />
    <meta property="og:description"  content="Descobreix rutes, llocs únics i connecta amb altres exploradors urbans. L'app d'exploració de ciutat definitiva." />
    <meta property="og:image"        content="https://catcircuit.cat/og-image.png" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale"       content="ca_ES" />
    <meta property="og:site_name"    content="WeMap" />

    <!-- ── Twitter Card (X) ── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:url"         content="https://catcircuit.cat" />
    <meta name="twitter:title"       content="WeMap - Explora la teva ciutat" />
    <meta name="twitter:description" content="Descobreix rutes, llocs únics i connecta amb altres exploradors urbans." />
    <meta name="twitter:image"       content="https://catcircuit.cat/og-image.png" />

    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <script>
      (function() {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark' || !savedTheme) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
