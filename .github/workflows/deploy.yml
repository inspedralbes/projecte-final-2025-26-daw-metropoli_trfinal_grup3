name: Deploy + Tests WeMap

on:
  push:
    branches:
      - main

jobs:
  # ── Job 1: Desplegament al servidor ────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # 1. Entrar a la carpeta donde clonaste el proyecto en el servidor
            cd ${{ secrets.SERVER_PATH }}

            # 2. Descargar los últimos cambios de GitHub
            git pull origin main

            # 3. Reconstruir y levantar los contenedores de Docker
            docker compose -f docker-compose.prod.yml build
            docker compose -f docker-compose.prod.yml up -d

  # ── Job 2: Tests E2E + API amb Cypress ─────────────────────────────────────
  test:
    name: Cypress Tests (E2E + API)
    runs-on: ubuntu-latest
    needs: deploy # S'executa APRÈS del desplegament
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: front/package-lock.json

      - name: Install front dependencies
        run: npm ci
        working-directory: front

      - name: Wait for server to be ready
        run: |
          echo "Waiting for server to be ready..."
          for i in {1..15}; do
            if curl -sf "http://${{ secrets.SERVER_HOST }}/api/categorias" > /dev/null 2>&1; then
              echo "Server is up!"
              break
            fi
            echo "Attempt $i: server not ready yet, waiting 10s..."
            sleep 10
          done

      - name: Run Cypress API Tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: front
          config-file: cypress.api.config.js
          config: baseUrl=http://${{ secrets.SERVER_HOST }},env.API_URL=http://${{ secrets.SERVER_HOST }}
          browser: chrome
          headless: true

      - name: Run Cypress E2E Tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: front
          config: baseUrl=http://${{ secrets.SERVER_HOST }},env.API_URL=http://${{ secrets.SERVER_HOST }}
          spec: cypress/e2e/auth.cy.js,cypress/e2e/profile.cy.js,cypress/e2e/community.cy.js
          browser: chrome
          headless: true
          install: false # ja instal·lat al pas anterior

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: front/cypress/screenshots
          if-no-files-found: ignore
