name: WeMap CI/CD — Test → Deploy

on:
  push:
    branches:
      - main

jobs:
  # ── Job 1: Tests de la API contra producció actual ─────────────────────────
  # Els tests s'executen ABANS de desplegar per evitar pujar codi trencat
  test:
    name: Cypress API Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for production server to be ready
        run: |
          echo "Comprovant accessibilitat a http://${{ secrets.SERVER_HOST }}:3000/api/categorias"
          curl -vI "http://${{ secrets.SERVER_HOST }}:3000/api/categorias" || echo "No se pudo conectar con curl"

      - name: Run Cypress API Tests (against current production)
        uses: cypress-io/github-action@v6
        with:
          working-directory: front
          config-file: cypress.api.config.js
          # Sobreescribimos la baseUrl para que apunte al host real de producción
          config: baseUrl=http://${{ secrets.SERVER_HOST }}:3000
          env: API_URL=http://${{ secrets.SERVER_HOST }}:3000
          browser: chrome
          # Forzamos a Cypress a esperar a que el endpoint de la API responda antes de empezar
          wait-on: 'http://${{ secrets.SERVER_HOST }}:3000/api/categorias'
          wait-on-timeout: 60
        env:
          CYPRESS_TEST_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          CYPRESS_TEST_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: front/cypress/screenshots
          if-no-files-found: ignore


  # ── Job 2: Desplegament al VPS (NOMÉS si els tests passen) ─────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: test  # ← DEPÈN dels tests: si fallen, NO es desplega
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ${{ secrets.SERVER_PATH }}
            git pull origin main
            docker compose -f docker-compose.prod.yml build
            docker compose -f docker-compose.prod.yml up -d

      - name: Smoke test after deploy
        run: |
          echo "Verificant que el nou desplegament funciona..."
          sleep 15
          curl -sf "http://${{ secrets.SERVER_HOST }}:3000/api/categorias" \
            && echo "✅ Deploy verificat correctament" \
            || (echo "❌ El servidor no respon després del deploy" && exit 1)

